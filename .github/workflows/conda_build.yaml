name: Conda Package CI/CD

# Two events, one version. See
# fdp-core/docs/specs/2026-09-15-staging-and-promotion.md section 3.
#
#   staging-X.Y.Z  -> build, upload to ga-fdp/label/staging
#   release-X.Y.Z  -> anaconda move staging -> main. NO rebuild.
#
# The release tag performs no build on purpose: promotion must ship the exact
# bytes the gate verified, and a rebuild would not.
on:
  push:
    branches:
      - main
    tags:
      - 'staging-*'
      - 'release-*'
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    # Not on a release tag: that promotes an existing artifact.
    if: "!startsWith(github.ref, 'refs/tags/release-')"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Build Conda package
        env:
          # Unconditional, not just for pre-releases. rattler-build's TEST
          # phase installs the package it just built, resolving run deps from
          # this channel list -- and siblings now live in staging until a
          # bless promotes them. Without it a recipe floor on a sibling
          # cannot resolve, which is what forced a serial release order on
          # 2026-09-14.
          EXTRA_CHANNEL: ga-fdp/label/staging
        run: |
          pixi global install rattler-build
          cd recipe && bash run_build.sh ${HOME}/outdir

      - name: Upload to staging
        if: startsWith(github.ref, 'refs/tags/staging-')
        run: |
          # Always staging. The old rc/a/b test is gone: a pre-release is now
          # simply a staging tag that never earns a release tag.
          rattler-build upload anaconda \
            --owner ga-fdp \
            --channel staging \
            --api-key ${{ secrets.ANACONDA_API_TOKEN }} \
            --force \
            ${HOME}/outdir/*/*.conda

      - name: Retire the superseded staging candidate
        # AFTER the upload, never before: retiring first would leave staging
        # empty if the upload then failed.
        #
        # This DELETES NOTHING. The old candidate is downloaded,
        # checksum-verified and moved to the `attic` label. A failed
        # candidate is evidence -- "why did the gate reject it?" is
        # unanswerable once the bytes are gone.
        if: startsWith(github.ref, 'refs/tags/staging-')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/staging-}"
          pixi global install anaconda-client
          python .github/scripts/retire_staging.py \
            toksearch_mast "${VERSION}" "${RUNNER_TEMP}/attic"

      - name: Keep the retired bytes off-channel
        # The attic label is one copy; this is the second, and it is the one
        # that survives the channel itself going wrong.
        if: always() && startsWith(github.ref, 'refs/tags/staging-')
        uses: actions/upload-artifact@v4
        with:
          name: retired-staging-candidates
          path: ${{ runner.temp }}/attic
          if-no-files-found: ignore
          retention-days: 90

  promote:
    # No build. `anaconda move` relabels the artifact that was already built
    # and verified, so what users install is what the gate checked.
    if: startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
      PKG: toksearch_mast
    steps:
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          run-install: false

      - name: Move staging -> main
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          # A shell variable does not survive into the next step, and
          # github.ref_name is "release-0.1.2" rather than "0.1.2".
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          pixi global install anaconda-client
          # `binstar`, not `anaconda`: anaconda-client declares only binstar
          # and conda-server as console scripts. `anaconda` belongs to
          # anaconda-cli-base, a dependency, which pixi installs but does not
          # expose.
          binstar -t "$ANACONDA_API_TOKEN" move \
            --from-label staging --to-label main \
            "ga-fdp/${PKG}/${VERSION}"

      - name: Verify it landed on main and left staging
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          version, pkg = os.environ["VERSION"], os.environ["PKG"]
          tok = os.environ["ANACONDA_API_TOKEN"]
          req = urllib.request.Request(
              f"https://api.anaconda.org/package/ga-fdp/{pkg}",
              headers={"Authorization": "token " + tok})
          labels = set()
          for f in json.load(urllib.request.urlopen(req))["files"]:
              if f["version"] == version:
                  labels |= set(f.get("labels") or [])
          print(f"{pkg} {version} labels: {sorted(labels)}")
          if "main" not in labels:
              sys.exit("promotion did not reach main")
          if "staging" in labels:
              sys.exit("still on staging: it copied rather than moved, so "
                       "staging now holds two versions and a later solve "
                       "could take the wrong one")
          PY
