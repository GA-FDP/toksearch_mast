python:
  # "3.11" and "3.12" (without the .*) mean ==3.11.0 and ==3.12.0 exactly, not
  # "any 3.11.x" -- so packages were being built against Python 3.11.0 (2022)
  # and 3.12.0 (2023). That worked by luck until conda-forge's 3.12.0 build set
  # grew debug-interpreter variants (*_debug_cpython); once the build
  # environment resolved one, the built package pinned a python that the test
  # environment could not find.
  - "3.11.*"
  - "3.12.*"
