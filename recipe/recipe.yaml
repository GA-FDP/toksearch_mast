context:
  version: ${{ env.get("PKG_VERSION") }}

package:
  name: toksearch_mast
  version: ${{ version }}

source:
  path: ..

build:
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - setuptools
    - pip
    - versioneer
  # rattler-build 0.39 synthesises a python run-export of
  # `python 3.12.* *_debug_cpython` from a host python whose build string is
  # plainly `h5f976f7_2_cpython`. conda-forge declares no python run-export on
  # any 3.12.14 build, and the python_abi export beside it is correct, so the
  # `debug_` prefix is invented by the tool -- and the resulting package is
  # uninstallable because no such python exists.
  #
  # Ignore the synthesised export and state the constraint from the variant.
  # python_abi still pins the ABI, so packages stay version-specific.
  ignore_run_exports:
    by_name:
      - python
  run:
    - python ${{ python }}
    - toksearch >=2.8.0
    # RELEASE COUPLING: these must be the ga-fdp releases that carry the new
    # zarr_store/http_catalog locator kinds (fdp-schema) and the locator-driven
    # env API + ZarrStore/HttpCatalog resolvers (fdp), from the mast-fdp-device
    # work. Floors bumped to the published versions verified against at the
    # 0.1.0 release; against older releases the catalog/env tests cannot pass.
    - fdp >=0.3.0
    - fdp-schema >=0.2.1
    - xarray
    - zarr >=3
    - fsspec
    - s3fs
    - aiohttp

tests:
  - script:
      content:
        # Run the package's unit suite (network-free); the live FAIR MAST
        # test is excluded via the `integration` marker.
        - python -m pytest tests/ -v -m "not integration"
    files:
      source:
        - tests/
    requirements:
      run:
        - pytest
        - fdp >=0.3.0
        - fdp-schema >=0.2.1

about:
  license: Apache-2.0
  summary: "TokSearch MAST: signal retrieval for MAST/MAST-U via FAIR MAST"

extra:
  recipe-maintainers:
    - sammuli
